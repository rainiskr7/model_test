# pre-commit hooks — bash + python lint
# 아래 명령은 Git 루트(model_test/)에서 실행한다. 이 작업에서는 hook을 설치하지 않는다.
# 설치: pre-commit install -c foundation_model_test_non_thinking/.pre-commit-config.yaml
# 수동 실행: pre-commit run -c foundation_model_test_non_thinking/.pre-commit-config.yaml --all-files

files: ^foundation_model_test_non_thinking/
exclude: ^foundation_model_test_non_thinking/(shared/harness/|configs/tests/|results/|data/|logs/)

repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [-x, --severity=warning]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
