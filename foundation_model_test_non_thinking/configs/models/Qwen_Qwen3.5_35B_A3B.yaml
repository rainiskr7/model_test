# 평가 모델 설정 — Qwen3.5-35B-A3B (vsm)
# vllm 의 served-model-name 이 'qwen_qwen3.5_35b_a3b' (소문자) 라서 model 필드는 그것에 맞춤.
# 결과 디렉토리도 그 명으로 생성됨.

model: qwen_qwen3.5_35b_a3b
tokenizer_path: /home/rainis/Desktop/workplace/models/Qwen_Qwen3.5_35B_A3B
class: vsm

endpoint:
  chat: http://127.0.0.1:18023/v1/chat/completions
  v1: http://127.0.0.1:18023/v1

tracks:
  - harness
  - nlu
  - agent
  - multimodal

agent:
  native_tool_calling: true

backend_reference:
  engine: vllm
  notes: |
    gpustack 에 vllm backend 로 등록 시 사용된 옵션:
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --limit-mm-per-prompt.image 4
      --enable-prefix-caching
      --async-scheduling
      --max-model-len 8192
    Qwen3.5-35B-A3B (MoE, active 3B). thinking 디폴트 ON 이라
    --default-chat-template-kwargs 로 false 강제 (3.6 과 동일 처리).
    ⚠️ --max-model-len 8192 로 서빙 중 — KRETA/비전 트랙에서 큰 이미지의
    vision prefill 이 8192 를 넘으면 길이초과 거부 가능. 24576+ 권장.
