# 평가 모델 설정 — DiffusionGemma-26B-A4B-it (vsm)
# run_full_eval.sh 가 이 파일을 로드해서 환경변수로 export.
# 평가는 gpustack 의 OpenAI-compat endpoint 를 통해 진행.

model: google_diffusiongemma_26B_A4B_it
tokenizer_path: /home/rainis/Desktop/workplace/models/google_diffusiongemma_26B_A4B_it
class: vsm

endpoint:
  chat: http://127.0.0.1:18023/v1/chat/completions
  v1: http://127.0.0.1:18023/v1

# ⚠️ harness 제외 — 이 서빙 스택에서 원리적으로 불가. 아래 diffusion_notes 참조.
tracks:
  - nlu
  - functionchat
  - taubench
  - multimodal

agent:
  native_tool_calling: true

# vLLM 으로 서빙되는 dLLM 공통 제약 — configs/serving_profiles/vllm_diffusion.yaml
# (unsupported_sampling_params / force_skip_special_tokens / skip_benches)
# 제약이 모델 특성이 아니라 vLLM 의 diffusion 계약이라 프로파일로 공유한다.
serving_profile: vllm_diffusion

# 프로파일 위에 덮어쓸 모델별 예외만 여기 쓴다.
serving:
  # --max-model-len 8192 로 서빙 중이라 nlu 의 max_tokens=8192 가 항상 400.
  # 정석은 서버를 --max-model-len 24576+ 로 재서빙하는 것(그러면 이 줄 삭제 가능).
  # 실측 응답이 ~270 토큰이라 4096 상한은 결과에 영향 없음.
  max_output_tokens: 4096

backend_reference:
  engine: vllm
  notes: |
    gpustack 에 vllm backend 로 등록 시 권장 옵션:
      --attention-backend TRITON_ATTN     ← GB10(Spark) 필수. 아래 참조.
      --enable-auto-tool-choice
      --tool-call-parser=gemma4
      --async-scheduling
      --limit-mm-per-prompt.image=4 --limit-mm-per-prompt.audio=0
    Gemma 4 계열과 동일하게 chat_template 디폴트가 non-thinking →
    --default-chat-template-kwargs 불필요.

    ⚠️ --attention-backend TRITON_ATTN 없으면 GB10(sm121)에서 기동 실패.
       증상: kernel_warmup → flashinfer_autotune → _dummy_run 중
             flashinfer.py:1128 `if causal:` 에서
             RuntimeError: Boolean value of Tensor with more than one value is ambiguous

       원인 체인:
       1. DiffusionGemma 는 배치 안에 causal(encoder)/bidirectional(decoder) 요청이
          섞여 common_attn_metadata.causal 이 bool 이 아니라 **텐서**로 온다.
       2. vLLM 은 이를 알고 use_non_causal=True 로 FlashInfer 를 배제하려 하지만
          (models/config.py:271-275), 실제 배제는 platforms/cuda.py:148 의
          `device_capability.major == 10` 분기에만 존재 → sm100(B200) 전용.
          GB10 은 sm121 이라 분기가 안 타고 FlashInfer 가 후보로 남는다.
          (FlashInferBackend.supports_non_causal() 는 True 를 반환하므로
           selector 도 걸러내지 못함 — flashinfer.py:383)
       3. text_config.global_head_dim = 512 인 full_attention 레이어는
          FlashAttention 으로 못 간다. flash_attn.py:176-182 —
          head_size>256 은 FA4 필요한데 이 환경은 FA2 (log: "FlashAttention version 2").
          → 그 그룹만 FLASHINFER 로 떨어지고, FlashInfer builder 가 텐서 causal 에
            대해 `if causal:` 을 실행하며 죽는다.

       FLASH_ATTN / TRITON_ATTN 은 `causal: bool | torch.Tensor` 로 선언해
       텐서 케이스를 처리한다(flash_attn.py:288/333/683, triton_attn.py:83/236/701).
       TRITON_ATTN 은 head size 제한이 없어(get_supported_head_sizes 미정의 → base 무제한)
       head_dim 256/512 두 그룹 모두 커버 가능 → 전역 지정이 가장 단순한 해법.

       ※ 그룹별 지정(AttentionConfig.backend_per_kind, kind='full_attention')이
         더 외과적이지만 이 빌드에선 CLI 노출이 --attention-backend 뿐이라 불가.

    ⚠️ --chat-template 을 명시하지 말 것.
       모델 디렉터리에 chat_template.jinja (Gemma 4 canonical, 2026-07-09) 가
       동봉되어 있어 vLLM 이 자동 로드한다. tokenizer_config.json 에는
       embedded chat_template 이 없으므로 이 파일이 유일한 소스.
       (gemma_4_26B 항목을 복제하면 /models/google_gemma_4_26B_A4B_it/... 경로가
        남아 존재하지 않는 디렉터리를 가리켜 vLLM 이 기동 즉시 죽는다.)

  diffusion_notes: |
    ⚠️ 이 모델은 autoregressive 가 아니라 block-diffusion 이다.
       architectures: DiffusionGemmaForBlockDiffusion / model_type: diffusion_gemma
       model_index.json: DiffusionGemmaPipeline + BlockRefinementScheduler
       config.json: canvas_length = 256

    vLLM 구현(model_executor/models/diffusion_gemma.py) 은 2단계 구조:
      - encoder(prefill) 모드: causal attention, KV cache write  ← 일반 Gemma4 레이어
      - decoder(생성) 모드   : bidirectional attention, canvas denoising
    diffusion 은 *생성 단계에만* 개입한다.

    트랙별 영향:
      - harness : 영향 없음. lm_eval local-completions 의 loglikelihood 채점은
                  echo prompt-logprob → prefill 포워드 패스만 사용하고,
                  그 경로가 causal 이므로 p(continuation|context) 의미가
                  autoregressive 모델과 동일. 기존 설정(LM_EVAL_MODE=chat,
                  --apply_chat_template, 5-shot) 그대로 사용.
      - nlu/agent : 동작하나 생성 단위가 다름. commit 스텝에서 canvas 단위로
                  최대 256 토큰이 한 번에 확정(diffusion_gemma.py:604) →
                  nlu 의 max_tokens 8192 는 canvas 약 32회 commit.
                  정확도엔 영향 없으나 지연 패턴이 기존 모델과 다르다.
      - multimodal : 정확도 벤치(k_mmbench/koffvqa/mtvqa_kr/k_dtcbench) 영향 없음.
                  단 b4_latency_profile.py 의 TTFT/ITL 은 재해석 필요 —
                  토큰이 256개씩 버스트로 도착해 블록 내부 ITL≈0, 경계에서 큰 갭.
                  기존 AR 모델과 같은 축에 놓고 비교하지 말 것.
