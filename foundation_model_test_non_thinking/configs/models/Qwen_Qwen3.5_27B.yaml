# 평가 모델 설정 — Qwen3.5-27B (vsm)
# gpustack served-id 를 'qwen_qwen3.5_27b' 로 맞춤(2026-10-25, 백엔드 served-model-name 과 동일).
# 결과 디렉토리도 그 명으로 생성됨 — 추후 룰 맞게 rename 가능.

model: qwen_qwen3.5_27b

# KRETA 는 direct 모드(기존 모델·qwen3.5 FP8 과 같은 조건).
kreta_setting: direct
tokenizer_path: /home/rainis/Desktop/workplace/models/Qwen_Qwen3.5_27B
class: vsm

endpoint:
  chat: http://127.0.0.1:18023/v1/chat/completions
  v1: http://127.0.0.1:18023/v1

tracks:
  - harness
  - nlu
  - functionchat
  - taubench
  - multimodal

agent:
  native_tool_calling: true

backend_reference:
  engine: vllm
  notes: |
    gpustack 에 vllm backend 로 등록 시 권장 옵션:
      --enable-auto-tool-choice
      --enable-prefix-caching
      --async-scheduling
    Qwen3.5 dense 27B. thinking 을 지원한다(11-10 정정 — 예전 "thinking 모드 없음" 메모는 틀렸다).
    템플릿은 enable_thinking 미지정 시 <think> 를 연다. N 평가에서는 서빙 설정 enable_thinking=false 로 끈다
    (BF16 은 서빙 감사 기록이 없고, KRETA direct 응답 평균 3.9자로 생각 안 한 것을 확인).
