# 평가 모델 설정 — NVIDIA Nemotron 3.5 Lightning 30B-A3B (bf16)
# run_full_eval.sh 가 이 파일을 로드해서 환경변수로 export.

model: nvidia_nvidia_nemotron_3.5_lightning_30b_a3b_bf16

# ⚠️ 이 모델은 8번 서버에서만 서빙된다. 평가는 7번 호스트에서 돌리므로
#    엔드포인트가 127.0.0.1 이 아니라 8번의 주소다.
#    8번은 SSH 가 열려 있지 않아 그 호스트에서 직접 돌릴 수 없다.
tokenizer_path: ""
class: vsm

endpoint:
  chat: http://192.168.0.8:18023/v1/chat/completions
  v1: http://192.168.0.8:18023/v1

# ⚠️ harness 제외 — 원리적 제약이 아니라 **환경 제약**이다.
#    lm-eval 은 로컬 토크나이저가 있어야 프롬프트를 토큰화하는데, 이 모델의
#    가중치·토크나이저는 8번 서버에만 있고 7번에는 없다(실측: ~/Desktop/workplace/
#    models 에 nemotron 디렉토리 없음). 토크나이저를 7번에 복사하거나 공개 HF
#    repo id 를 알면 그때 harness 를 다시 넣을 수 있다.
tracks:
  - nlu
  - functionchat
  - taubench
  - multimodal

agent:
  native_tool_calling: true

backend_reference:
  engine: vllm
  notes: |
    서빙 위치: 192.168.0.8:18023 (gpustack v2.2.3 게이트웨이).
    7번과 8번은 **API 키가 다르다** — 7번 키로 8번을 부르면 401 이다(실측).
    따라서 이 모델을 7번 호스트에서 돌릴 때는 8번 키를 호출자가 export 해야 한다:

      OPENAI_API_KEY=<8번 키> ./run_repeated_eval.sh nvidia_nemotron_3.5_lightning_30b_a3b_bf16 3

    run_full_eval.sh 는 .env 보다 호출자가 export 한 키를 우선한다.
