# 평가 모델 설정 — NVIDIA Nemotron 3.5 Lightning 30B-A3B (bf16)
# run_full_eval.sh 가 이 파일을 로드해서 환경변수로 export.

model: nvidia_nvidia_nemotron_3.5_lightning_30b_a3b_bf16

# ⚠️ 이 모델은 8번 서버에서만 서빙된다. 평가는 7번 호스트에서 돌리므로
#    엔드포인트가 127.0.0.1 이 아니라 8번의 주소다.
#    8번은 SSH 가 열려 있지 않아 그 호스트에서 직접 돌릴 수 없다.
# harness 를 켜기 전에 반드시 채워야 한다. 빈 문자열을 넘기면 러너의
# `${2:-...}` 가 **다른 모델의 토크나이저로 조용히 대체**하므로, 이제 러너가
# 빈 값을 거부한다(shared/harness/run_harness.sh).
tokenizer_path: ""
class: vsm

endpoint:
  chat: http://192.168.0.8:18023/v1/chat/completions
  v1: http://192.168.0.8:18023/v1

# ⚠️ harness 제외 — 원리적 제약이 아니라 **환경 제약**이다.
#    lm-eval 은 로컬 토크나이저가 있어야 프롬프트를 토큰화하는데, 이 모델의
#    가중치·토크나이저는 8번 서버에만 있고 7번에는 없다(실측: ~/Desktop/workplace/
#    models 에 nemotron 디렉토리 없음). 토크나이저를 7번에 복사하거나 공개 HF
#    repo id 를 알면 그때 harness 를 다시 넣을 수 있다.
# ⚠️ multimodal 제외 — 이 모델은 **입력 모달리티가 텍스트뿐**이다.
#
#    근거는 두 가지이고, 순서가 중요하다.
#
#    1) 공식 모델 카드(NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16)가
#       Input Type(s): Text / Input Format(s): String 으로만 선언하며 비전
#       인코더를 언급하지 않는다. 아키텍처도 Mamba-2 + MoE 언어 모델이다.
#       https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
#       (이름이 비슷한 Nemotron 3 Nano **Omni** 는 멀티모달이다. 다른 모델이다.)
#
#    2) 실측(2026-08-30)이 그것과 일치한다. 이미지 요청이 전부 거부됐다:
#         400 BadRequest: "... is not a multimodal model"
#       kreta 2,577 · k_mmbench 4,329 · mtvqa_kr 558 · koffvqa 275 ·
#       k_dtcbench 240 · b4 이미지 150 — 합계 8,129 호출이 측정 0으로 실패했고
#       발행 게이트가 모두 막았다(publishable=false).
#
#    **2)만으로는 이 결론을 낼 수 없다.** 400 은 서빙 스택이 낸 것이므로 배포가
#    이미지 지원 없이 떴을 때도 같은 응답이 나온다. 실제로 이 저장소의 다른
#    config 들은 그 구분을 지켜, 서빙 제약은 backend_reference 에 적고 트랙은
#    남겨둔다(diffusiongemma, Muse). 여기서 트랙을 빼는 근거는 1) 이다.
#    같은 런에서 텍스트 전용 호출(b4 텍스트 조건)은 50/50 성공했다 — 배포가
#    죽은 것이 아니라 이미지 경로만 거부된 것이다.
tracks:
  - nlu
  - functionchat
  - taubench

agent:
  native_tool_calling: true

backend_reference:
  engine: vllm
  notes: |
    서빙 위치: 192.168.0.8:18023 (gpustack v2.2.3 게이트웨이).
    7번과 8번은 **API 키가 다르다** — 7번 키로 8번을 부르면 401 이다(실측).
    따라서 이 모델을 7번 호스트에서 돌릴 때는 8번 키를 호출자가 export 해야 한다:

      OPENAI_API_KEY=<8번 키> ./run_repeated_eval.sh nvidia_nemotron_3.5_lightning_30b_a3b_bf16 3

    run_full_eval.sh 는 .env 보다 호출자가 export 한 키를 우선한다.
