# 평가 모델 설정 — Qwen3.5-35B-A3B FP8 (vsm)
# 서빙 id = gpustack /v1/models 의 실제 id = qwen_qwen3.5_35b_a3b_fp8 (소문자).
# BF16 판(qwen_qwen3.5_35b_a3b)과 별개 모델 — 결과 폴더도 fp8 태그로 분리 생성됨.
# preflight(run_full_eval.sh)가 이 id 문자열과 대조하므로 반드시 일치시킬 것.

model: qwen_qwen3.5_35b_a3b_fp8
tokenizer_path: /home/rainis/Desktop/workplace/models/Qwen_Qwen3.5_35B_A3B_FP8
class: vsm

endpoint:
  chat: http://127.0.0.1:18023/v1/chat/completions
  v1: http://127.0.0.1:18023/v1

tracks:
  - harness
  - nlu
  - agent
  - multimodal

backend_reference:
  engine: vllm
  notes: |
    gpustack vllm backend, block-wise FP8 (config.json quant_method fp8).
    arch=qwen3_5_moe (MoE, active 3B), vision 포함.
    서빙 확인: --served-model-name qwen_qwen3.5_35b_a3b_fp8, --port 40065 (gpustack→18023 프록시).
    실제 서빙 옵션:
      --max-model-len 30000        # ✅ 24576↑ (max-model-len 8192 서빙 시 nlu 400 실패 함정 회피)
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'   # MTP ON (Qwen3_5MoeMTP)
      --default-chat-template-kwargs '{"enable_thinking": false}'          # non-thinking 강제
      --enable-auto-tool-choice --tool-call-parser qwen3_coder             # agent 트랙용
      --limit-mm-per-prompt.image 4                                        # vision 트랙용
      --async-scheduling
      # (참고) --enable-prefix-caching 는 20260711 실행 커맨드엔 미포함 — 성능 옵션, 정확도 무관.
    thinking 디폴트 ON 이라 enable_thinking:false 로 non-thinking 강제
    (라이브 엔드포인트 확인: reasoning_content 없음).
    KRETA 는 direct 모드(max_tokens 32)로 실행 — run_full_eval 앞단에서
    KRETA_SETTING=direct export. GB10 느린 디코드 안전 + 편향 절단 회피.
    ⚠️ harness 는 chat_template 을 클라이언트측(tokenizer_path)에서 적용.
       models/Qwen_Qwen3.5_35B_A3B_FP8/chat_template.jinja 는 non-fp8(Qwen_Qwen3.5_35B_A3B)과
       바이트 동일 확인 → non-thinking 채점 동일하게 동작 (별도 패치 불필요).
    ⚠️ BF16 판이 --max-model-len 8192 로 서빙됐던 이력 있음 — 큰 이미지 vision
       prefill 이 max-model-len 초과 시 길이초과 거부 가능. per-sample 에러는
       idempotent resume 로 처리되나, 다수 실패 시 서빙 max-model-len 확인 필요.
