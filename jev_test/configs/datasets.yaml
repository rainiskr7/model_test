    translator: "P0 에 결정 — 로컬 Qwen3.8-27B(외부 전송 없음) 또는 외부 API(공개 데이터라 가능)"
    review: "고정 seed 50 사례를 사람이 검수 — 뜻이 바뀐 문항은 제외 목록에 기록"
  label: 영어 consensus 를 그대로 쓴다 (번역이 뜻을 보존한다는 가정 — 검수로만 확인)

