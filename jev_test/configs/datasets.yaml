t0:
  fixtures: jev_test/tests/fixtures/parity/*.json      # 직접 만든다 (세 종류 · choice 2/8/16 · 한국어 선택지 · 질문 8개 묶음 · 긴 state)
  decision_index:
    kit: apolinario/decision-index                       # commit 은 P0 에 고정
    edition: "0.2.1"
    benchmarks: {4: BANKING77, 5: "CLINC150+OOS", 11: ContractNLI, 12: ANLI, 39: FinEntity}
    note: 키트가 스위트를 원본에서 받아 빌드한다(~7GB 다운로드, ~17GB 작업). ANLI CC-BY-NC-4.0, FinEntity 미기재

