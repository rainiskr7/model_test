workflow:
  # Typesafe 가 Jev 용으로 만든 업무 평가. 러너: github.com/typesafe-ai/WorkflowEvals (Apache-2.0, 10-12 확인)
  #   - 정답은 사람 라벨이 아니다: gpt-6-astra(high) 와 claude-fable-5-1(high) 의 답 확률 평균("consensus").
  #     채점 = 그 합의와의 일치 (exact_actions: 행동+인자 일치, primary_action). → "프런티어 LLM 판단을 얼마나 따라가나"
  #   - 질문마다 consensus 확률이 있다 → 정답 일치뿐 아니라 분포 차이(KL)·보정도 잴 수 있다.
  #   - 러너가 `--model typesafe:<이름> --base-url <서버>` 로 /v1/systemone 서버를 그대로 채점한다.
  #   - 공개 점수 (Cloudflare 블로그, exact): Clef / Clef-Flash / Jev
  runner: {repo: typesafe-ai/WorkflowEvals, commit: "P0 에 고정", dataset_revision: "P0 에 고정"}
  sets:
    - {id: wf_invoice, hf: typesafe/evalsafe-invoice-processing, sha: 6beeb2d, cases: 150, questions: 6874, license: Apache-2.0,
       task: "송장 승인·사기 판별, 정책 3종", published: {clef: 64.7, clef_flash: 57.1, jev: 61.8}}
    - {id: wf_customer_service, hf: typesafe/evalsafe-customer-service, sha: b1342f5, cases: 204, questions: 3287, license: "HF 미기재 (러너 Apache-2.0)",
       task: "고객 문의 라우팅·행동, 정책 3종", published: {clef: 76.3, clef_flash: 77.0, jev: 76.0}}
    - {id: wf_security, hf: typesafe/evalsafe-security-incidents, sha: fbe1ea5, cases: 240, questions: 1820, license: "HF 미기재",
       task: "보안 경보 분류·격리", published: {clef: 62.9, clef_flash: 61.7, jev: 61.7}}
    - {id: wf_agent_trace, hf: typesafe/evalsafe-agent-trace-observability, sha: "8635540", cases: 111, questions: 1124, license: "HF 미기재",
       task: "에이전트 실행 기록 검토 행동 선택", published: {clef: 68.5, clef_flash: 69.8, jev: 71.6}}
  check: 데이터 라이선스(3종 HF 미기재) · 각 세트 split 은 test 하나(cases/questions/run_results)

