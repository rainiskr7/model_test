        도구: {type: choice, criteria: "input_tools 이름 → 설명 + NONE('호출하지 않는다')", label: "call 이면 ground_truth 의 도구 이름, 아니면 NONE"}
      normalize: "system 메시지의 '누락된 필수 정보가 여러가지이면, 각각을 모두 빠짐없이 구체적으로 요청하세요.' 두 번 연속을 한 번으로 (slot 406 행만 해당 — 정답 단서)"
      dropped: "'정보충분' 질문 — 행동 라벨과 같은 정보"
    tier: 1
    group: A
    note: >-
      결정 모델의 대표 용도(도구 게이트). 불균형(call 100 / slot 406 / relevance 100) — macro-F1.
      영어 When2Call 에서 Clef 72.4 < Jev 81.0 (블로그) — 한국어에서도 Clef 가 '부를지 말지' 에 약한지 본다.
      '도구' 정답은 원 데이터에서 추출(call 이면 ground_truth 의 도구, 아니면 NONE). '정보충분' 은 개정 10 에서 삭제

