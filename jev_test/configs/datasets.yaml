    unit: "시나리오 연결요소 107 — 첫 사용자 발화 일치 또는 input_tools 일치로 이은 연결요소 (10-13 집계: 첫 발화만이면 315 묶음이지만 serial 340·363 처럼 도구·뒤쪽 대화를 공유하는 변형이 갈린다). 묶음당 대표 1행 고정 seed, 개발 21 · 시험 86. 위험은 시나리오 균등 — 1·2% 는 원리적 표본 부족, 5% 만 가능. 606행 F1·처리율은 기술 통계"
