# jev_test 데이터셋 목록 (SSOT 초안) — 2026-10-12 HF API · datasets-server 로 확인
#
# 필드
#   hf / config / split : 평가에 쓰는 정확한 위치. split 은 "봉인" — 프롬프트·설정 튜닝에 쓰지 않는다.
#   sha                 : 확인 시점 리포 revision (앞 7자리). P0 에서 전체 sha 로 고정한다.
#   rows                : 확인한 split 의 문항 수.  cap: 평가에 쓰는 최대 문항 수(고정 seed 표본 — 층화면 층별 할당 수를 그 셋에 적는다, 계획 §4-3).
#   unit                : 묶음 키 — 묶음당 대표 요청 1개, 개발/시험은 묶음 단위로 나눈다 (계획 §4-3).
#   label_source        : 정답을 누가·어떻게 만들었나 (계획 §3 A 라벨 출처). 확인 전이면 "미확인".
#   kind                : noul | noul_multi | choice | score
#   map                 : state / question / 선택지 / 정답을 어느 열에서 만드는지.
#   tier                : 1 = 1차(먼저 돌린다), 2 = 2차
#   group               : A = 업무 결정 (핵심 — Jev 식 사용법: JSON 상태 + 질문 여러 개 + 직접 정의한 선택지)
#                         B = 한국어 판단력 (바닥 점검 — pplx 학습 목록에 없는 셋)
#                         C = pplx 가 학습한 과제 (주 표에 넣지 않고 부록 — 계획 §3-C)
#                         support = 보조 — 정답이 사람이 아닌 셋 (본시험 표에 넣지 않는다 — 계획 §3 보조)
#   check               : P0 에서 확인할 것 (없으면 생략)
#
# 라이선스는 내부 평가 전제. 변환본·문항을 재배포하지 않는다 (ND / NC 포함).
#
# group C 의 근거: pplx-decider-v1.1-27b `training/data-manifest.json` 의 source_rows 에
#   multilingual/klue/nli 321 · klue/sts 164 · klue/ynat 338 · multilingual/massive 535 (10-12 직접 확인).
#   어느 split 에서 뽑았는지는 manifest 에 없다 — 문항 중복은 P0 에서 확인, 과제 형식 노출은 확정.
#   Clef 는 학습 데이터 미공개 — 노출 여부를 알 수 없다.

seed: 20261012

# ======================================================================
# group A — 업무 결정 (핵심)
# ======================================================================
korean_decisions:
  # group A 의 한국어 공개 라벨 셋 — Jev 식 형식(상황 + 질문 여러 개)으로 재구성한다. 라벨 출처는 셋마다 label_source
  - id: kosgd
    hf: chaeyeonn/KoSGD
    split: test
    sha: d725461
    rows: "대화 4,201 (턴 84,594)"
    license: CC-BY-SA-4.0
    label_source: "영어 SGD 를 기계 번역 후 전문 인력이 전수 검수, 원본 주석 오류도 수정 (카드)"
    schema: data/test/extended_schema.json      # 서비스 21 · 의도 38 — 서비스·의도 이름과 설명만 쓴다 (슬롯 없음)
    unit: "대화당 USER 턴 1개 (고정 seed) — 같은 대화의 턴끼리는 독립이 아니므로 대화 단위로 뽑는다"
    cap: 3000
    map:   # 개정 11 (10-13) — 사용자 결정: 사람 라벨링 없음 · 칸 2개 · 두 판
      state: "{dialogue: 첫 턴~이 턴의 발화자·발화 (앞), catalog: test 스키마 서비스 21 · 의도 38 의 이름·설명 — 모든 요청에 바이트 동일 (뒤)}"
      variants:
        full: [진행중_1, 진행중_2, 행동_성공판정, 행동_진단]      # 성공 판정 10
        actions_only: [행동_성공판정, 행동_진단]                  # 성공 판정 8 — pplx 는 full 출력에서 계산, Clef 계열은 따로 실행
      primary_variant: full   # 감사 v3 (10-13) 결과. 그때 규칙: "R2v3·R4·R5·R6·R7 모두 PASS → full, 하나라도 FAIL → actions_only"
      primary_variant_rule_next: "개정 12 — 판마다 그 판에 해당하는 R2v3·R4·R5·R6·R7 을 모두 통과한 판만 후보. full 이 후보면 full, 아니면 actions_only, 둘 다 아니면 멈춤 (계획 §7-1)"
      questions:
        진행중_1: {type: choice, criteria: "서비스/의도 38 (→ 의도 설명) + NONE", instructions_rule: "①·②에 서로 다른 진행 중인 일을 서비스 목록 순서대로, 없으면 NONE"}
        진행중_2: {type: choice, criteria: "진행중_1 과 같음"}
        진행중_label: "그 턴 frames[].state.active_intent 중 NONE 이 아닌 것의 집합, 모자란 칸은 NONE"
        진행중_scoring: "순서 무관 — 두 칸 답 묶음 == 정답 묶음이면 맞음, NONE 이 아닌 같은 답이 두 칸이면 틀림"
        행동_성공판정: {type: noul, items: [INFORM, REQUEST, AFFIRM, NEGATE, REQUEST_ALTS, SELECT, "CLOSE(GOODBYE·THANK_YOU)", INFORM_INTENT], label: "frames[].actions[].act 집합"}
        행동_진단: {type: noul, items: [AFFIRM_INTENT, NEGATE_INTENT], note: "시험 양성 ~60 건씩 — 성공 판정·확신 점수에서 뺀다"}
      baseline_copy: "직전 USER 턴의 정답 진행 중인 일 집합 (첫 USER 턴은 NONE) — 모델이 모르는 직전 정답을 쓰는 지속성 기준, 칸 묶음 정답률만"
    act_inventory: "11종으로 동결 (10-12 전체 3,000 턴 라벨 집계): INFORM 1864 · INFORM_INTENT 812 · THANK_YOU 409 · AFFIRM 368 · SELECT 564 · REQUEST 519 · GOODBYE 223 · NEGATE 228 · REQUEST_ALTS 130 · NEGATE_INTENT 78 · AFFIRM_INTENT 68 — 목록 밖 act 0 건이어야 한다(R1 v2)"
    audit: "audits/kosgd_audit (보존본 — 실행은 세션 폴더) (R1 FAIL 31.2% · R2 FAIL 82.6% · R3 PASS, 개정 9 구성 기준) → 개정 10 구성: 목록 밖 0/3000, 요청 최대 4,329 토큰, 8,192 초과 0% → 개정 11 구성: 감사 v3 (계획 §7-1, 보존본 audits/audit_v3) R2v3·R4·R5·R6·R7 PASS (10-13) → 주 지표 full, 최대 4,902 토큰"
    pair: "영어 원본 SGD test (google-research-datasets/dstc8-schema-guided-dialogue) 와 dialogue_id 로 짝 — 언어 격차. 행동·진행 중인 의도 라벨은 USER 턴 42,297 개 전부 영어판과 같다 (감사 v3, KoSGD 수정은 슬롯 쪽) — 판본 민감도 표는 내지 않는다"
    note: "Decision Index 에 영어 SGD/SGD-X 가 있다 (Clef 43.8 · Jev 43.0, 블로그) — 공개 점수가 있는 벤치라 개발 중 노출 가능성 표시"
    check: 다중 서비스 턴 8.5% 는 빼지 않는다 (active_intent 시점은 감사 v3 R6 PASS 로 판정 끝)
    label_review: "사람 재라벨 없음 (10-13) — 인증은 정답지 기준, 판정 여유 b_flip 함께 (계획 §4-2)"
    label_source: "영어 SGD 시뮬레이터가 대화 뼈대와 함께 만든 주석 + 크라우드가 문장만 바꿔 씀 (SGD 논문 §3), 한국어는 번역 — 행동·진행 중인 의도 라벨은 영어판과 USER 턴 전부 같음"
    tier: 1
    group: A

