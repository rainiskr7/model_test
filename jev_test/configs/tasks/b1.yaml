# 초안 (10-13, Claude) — 사용자 결정 전. P1_CONTRACT.md §2-5 · 계획 §2-3. user_template 은 계약 §2-5 와 같아야 한다 ({options} = 선택지 줄을 줄바꿈으로 이은 것).
