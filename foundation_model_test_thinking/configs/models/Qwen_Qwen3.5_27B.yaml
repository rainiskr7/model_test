# 평가 모델 설정 — Qwen3.5-27B (vsm)
# vllm 의 served-model-name 이 'qwen3.5_27b' (소문자) 라서 model 필드는 그것에 맞춤.
# 결과 디렉토리도 그 명으로 생성됨 — 추후 룰 맞게 rename 가능.

model: qwen3.5_27b
tokenizer_path: /home/rainis/Desktop/workplace/models/Qwen_Qwen3.5_27B
class: vsm

endpoint:
  chat: http://127.0.0.1:18023/v1/chat/completions
  v1: http://127.0.0.1:18023/v1

tracks:
  - harness
  - nlu
  - agent
  - multimodal

# sampling: 이 모델은 thinking 모드가 없으나, thinking 파이프라인의 CoT 프롬프트로 평가된다
# (추론 트레이스는 안 나오고 '정답: X'만 — 파서가 견고 처리). Qwen non-thinking 권장값 사용.
sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 8192
  seed: 42
  timeout: 600

backend_reference:
  engine: vllm
  notes: |
    gpustack 에 vllm backend 로 등록 시 권장 옵션:
      --enable-auto-tool-choice
      --enable-prefix-caching
      --async-scheduling
    Qwen3.5 dense 27B. thinking 모드 없음 (Qwen3.6 와 다름) — enable_thinking 옵션 불필요.
    thinking 파이프라인에서도 평가는 가능하나(CoT 프롬프트 + 생성기반 채점),
    추론 트레이스가 없으므로 thinking 비교의 baseline 으로만 해석할 것.
